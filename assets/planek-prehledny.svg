      .swing { fill: none; stroke: #83948c; stroke-width: 1.7; }
      .room-name { font-size: 25px; font-weight: 600; text-anchor: middle; }
      .room-area { font-size: 30px; font-weight: 600; text-anchor: middle; }
      .small-name { font-size: 23px; font-weight: 600; text-anchor: middle; }
      .small-area { font-size: 24px; font-weight: 600; text-anchor: middle; }
      .furnishing { stroke: #9caa9e; stroke-width: 1.4; stroke-linejoin: round; }
