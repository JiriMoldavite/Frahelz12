<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="plan-title plan-desc" lang="cs" xml:lang="cs">
  <title id="plan-title">Půdorys zařízeného bytu – 45,37 m²</title>
  <desc id="plan-desc">Vstup vede do zádveří o ploše 3,38 m². Vlevo je koupelna s umyvadlem a sprchou, 3,36 m², a WC, 1,22 m². Ze zádveří se vstupuje do obývacího pokoje s kuchyní, 24,18 m², s jídelním stolem, sedačkou, televizí a krbovými kamny. Vpravo je ložnice, 13,23 m², s postelí, nočními stolky, komodou a skříní.</desc>
